name: MarketMaster CI/CD & Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Frontend Test Suite & Nitro SSR Production Build
  # =========================================================================
  frontend-ci:
    name: Frontend Vitest Suite & Nitro Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Vitest Unit & Component Tests
        run: pnpm test

      - name: Build TanStack Start / Nitro SSR Bundle
        run: pnpm build

      - name: Verify Web Distribution Artifacts
        run: |
          test -d .output || (echo "Missing .output directory after build" && exit 1)
          echo "Production frontend build verified successfully."

  # =========================================================================
  # 2. Backend Quant Math, Matching Engine & Ledger Reconciliations
  # =========================================================================
  backend-ci:
    name: Backend Pytest & Double-Entry Ledger Reconciliation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest tests -v --tb=short

  # =========================================================================
  # 3. ₹0 Free-Tier Cloud Deployment Readiness Gate
  # =========================================================================
  deployment-readiness:
    name: ₹0 Cloud Deployment Gate (Render / Railway / Vercel)
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Cloud Orchestration Manifests
        run: |
          test -f render.yaml || (echo "render.yaml missing" && exit 1)
          test -f vercel.json || (echo "vercel.json missing" && exit 1)
          test -f docker/docker-compose.yml || (echo "docker-compose.yml missing" && exit 1)
          echo "All ₹0 cloud deployment manifests validated successfully."
